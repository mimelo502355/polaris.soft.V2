<div class="modal-backdrop-recovery" *ngIf="mostrarModal" (click)="cerrar()">
  <div class="modal-recovery" (click)="$event.stopPropagation()">
    
    <div class="recovery-header">
      <h3>🔑 Recuperar Contraseña</h3>
      <button class="btn-close" (click)="cerrar()">✕</button>
    </div>

    <div class="recovery-content">
      
      <!-- PASO 1: DNI + EMAIL -->
      <div *ngIf="paso === 1" class="recovery-step">
        <p class="recovery-subtitle">Ingresa tu DNI y email para recuperar tu contraseña</p>

        <div class="form-group">
          <label>DNI (8 dígitos)</label>
          <input 
            type="text" 
            [(ngModel)]="dni" 
            placeholder="12345678"
            maxlength="8"
            [disabled]="enviando"
            class="form-input">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="tu@email.com"
            [disabled]="enviando"
            class="form-input">
        </div>

        <button 
          class="btn-recuperar" 
          (click)="enviarCodigoEmail()" 
          [disabled]="!dni || !email || enviando || dni.length !== 8">
          <span *ngIf="!enviando">Enviar Código</span>
          <span *ngIf="enviando">Enviando...</span>
        </button>
      </div>

      <!-- PASO 2: CÓDIGO OTP + NUEVA CONTRASEÑA -->
      <div *ngIf="paso === 2" class="recovery-step">
        <p class="recovery-subtitle">Ingresa el código enviado a tu email y tu nueva contraseña</p>

        <div class="form-group">
          <label>Código (6 dígitos)</label>
          <input 
            type="text" 
            [(ngModel)]="codigo" 
            placeholder="000000"
            maxlength="6"
            [disabled]="cargando"
            class="form-input">
        </div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input 
            type="password" 
            [(ngModel)]="passwordNueva" 
            placeholder="••••••••"
            [disabled]="cargando"
            class="form-input">
        </div>

        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input 
            type="password" 
            [(ngModel)]="passwordConfirm" 
            placeholder="••••••••"
            [disabled]="cargando"
            class="form-input">
        </div>

        <button 
          class="btn-recuperar" 
          (click)="confirmarRecuperacion()" 
          [disabled]="!codigo || !passwordNueva || cargando || codigo.length !== 6">
          <span *ngIf="!cargando">Cambiar Contraseña</span>
          <span *ngIf="cargando">Procesando...</span>
        </button>

        <button 
          class="btn-secondary" 
          (click)="volverAlPaso1()" 
          [disabled]="cargando">
          ← Volver
        </button>
      </div>

      <!-- PASO 3: ÉXITO -->
      <div *ngIf="paso === 3" class="recovery-step success">
        <div class="success-icon">✅</div>
        <h4>¡Contraseña actualizada!</h4>
        <p>Ya puedes iniciar sesión con tu nueva contraseña</p>
      </div>
    </div>
  </div>
</div>
